<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trabajo practico de DOM Y BOM">
    <meta name="keywords" content="DOM, BOM, POO, javascript">
    <meta name="author" content="Valentina Iramain">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
    <title>TP5 - JS - Lista de Tareas</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container py-2">
                <a class="navbar-brand text-primary-emphasis fw-bold" href="#">Lista de Tareas</a>
            </div>
        </nav>
    </header>
    <main class="container">
        <h1 class="text-center my-4 text-secondary fw-bold">Ingresar Tarea</h1>
        <form class="p-2 fw-bold">
            <div class="mb-3">
                <label for="tarea" class="form-label">Nueva Tarea:</label>
                <input type="text" class="form-control" id="tarea" placeholder="Ingrese la tarea a realizar">
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-secondary">Agregar</button>
            </div>
        </form>

    </main>
    <footer class="text-center py-3 bg-body-tertiary">
        <p>&copy; Todos los derechos reservados 2025</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/app.js"></script>
</body>

</html>
