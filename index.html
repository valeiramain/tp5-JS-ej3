<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trabajo practico de DOM Y BOM">
    <meta name="keywords" content="DOM, BOM, POO, javascript">
    <meta name="author" content="Valentina Iramain">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <title>TP5 - JS - Lista de Tareas</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-secondary-subtle">
            <div class="container py-2">
                <a class="navbar-brand fw-bold text-secondary fs-3" href="#">Lista de Tareas <i
                        class="bi bi-journal-text"></i></a>
            </div>
        </nav>
    </header>
    <main class="container">
        <h1 class="text-center mt-3 fw-bold colorTitulo">Ingresar Tarea</h1>
        <form class="p-2 fw-bold mb-3" id="formulario">
            <div class="mb-3">
                <input type="text" class="form-control" id="tarea" placeholder="Ingrese la tarea a realizar" required>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btnColor" id="btnAgregar">Agregar</button>
            </div>
        </form>

        <section class="container mb-2">
            <h3 class="text-center fw-bold colorTitulo">Lista de Tareas</h3>
            <ul class="list-group" id="listaTareas">
                <!-- <li> desde JS -->
            </ul>
        </section>

    </main>
    <footer class="text-center py-3 bg-secondary-subtle">
        <p>&copy; Todos los derechos reservados 2025</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/app.js"></script>
</body>

</html>
